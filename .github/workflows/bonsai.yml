name: Generate Git Bonsai

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Bonsai
        run: |
          npx git-bonsai-generator --user ${{ github.repository_owner }} --output bonsai.svg || npx @octocat/bonsai --user ${{ github.repository_owner }} --output bonsai.svg

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Git Bonsai"
          file_pattern: "bonsai.svg"
